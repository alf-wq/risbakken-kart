const statusEl = document.getElementById('status');
const say = t => statusEl.textContent = t;
const map = L.map('map', {zoomControl:false, maxZoom:21});
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.scale({imperial:false, position:'bottomleft'}).addTo(map);
const tile = n => L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/' + n + '/default/webmercator/{z}/{y}/{x}.png', {maxZoom:21, maxNativeZoom:18, attribution:'© Kartverket'});
let gray = false, base = tile('topo').addTo(map);
const baseBtn = document.getElementById('base');
baseBtn.onclick = () => { gray = !gray; map.removeLayer(base); base = tile(gray ? 'topograatone' : 'topo').addTo(map); base.bringToBack(); baseBtn.textContent = gray ? 'Farger' : 'Gråtone'; };

const style = f => {
  const t = f.properties.type;
  if (t === 'eiendom') return {color:'#15803d', weight:1.5, fill:false};
  if (t === 'bolig' || t === 'garasje') return {color:'#1d4ed8', weight:2.5, fillColor:'#1d4ed8', fillOpacity:.45};
  if (t === 'nabo') return {color:'#d97706', weight:2, fillColor:'#f59e0b', fillOpacity:.4};
  if (t === 'uteareal') return {color:'#0ea5e9', weight:1, fillColor:'#7dd3fc', fillOpacity:.3};
  if (t === 'byggegrense') return {color:'#dc2626', weight:2, dashArray:'6 5'};
  if (t === 'tomtegrense') return {color:'#7a1fa2', weight:2.5};
  if (t === 'formal') return {color:'#7a1fa2', weight:1.5};
  return {};
};
const order = ['eiendom','formal','tomtegrense','byggegrense','uteareal','nabo','garasje','bolig','felt'];
const feats = DATA.features.slice().sort((a,b) => order.indexOf(a.properties.type) - order.indexOf(b.properties.type));
const layer = L.geoJSON({type:'FeatureCollection', features:feats}, {
  style,
  pointToLayer: (f, ll) => L.marker(ll, {opacity:0, interactive:false}).bindTooltip(f.properties.navn, {permanent:true, direction:'center', className:'felt'}),
  onEachFeature: (f, l) => {
    const p = f.properties;
    if (p.type === 'eiendom' && p.navn) l.bindTooltip(String(p.navn), {sticky:true, className:'lbl'});
    if (['bolig','garasje','nabo','uteareal'].includes(p.type)) l.bindPopup('<b>' + p.navn + '</b><br>ca. ' + p.areal + ' m² (fotavtrykk)');
  }
}).addTo(map);
const homeBounds = L.geoJSON({type:'FeatureCollection', features:DATA.features.filter(f => ['bolig','garasje','nabo'].includes(f.properties.type))}).getBounds().pad(0.35);
map.fitBounds(homeBounds);

let following = true, me = null, acc = null, first = true;
const btn = document.getElementById('follow');
const meIcon = L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[22,22], iconAnchor:[11,11]});
btn.onclick = () => { following = !following; btn.classList.toggle('on', following); if (following && me) map.setView(me.getLatLng(), Math.max(map.getZoom(), 19)); };
map.on('dragstart', () => { following = false; btn.classList.remove('on'); });
document.getElementById('home').onclick = () => { following = false; btn.classList.remove('on'); map.fitBounds(homeBounds); };

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude], a = pos.coords.accuracy;
    if (!me) { acc = L.circle(ll, {radius:a, color:'#0a6cff', weight:1, fillOpacity:.1, interactive:false}).addTo(map); me = L.marker(ll, {icon:meIcon, zIndexOffset:1000}).addTo(map); }
    else { me.setLatLng(ll); acc.setLatLng(ll).setRadius(a); }
    if (following) map.setView(ll, first ? 19 : map.getZoom());
    first = false;
    say('GPS nøyaktighet ± ' + Math.round(a) + ' m');
  }, err => {
    following = false; btn.classList.remove('on');
    say('Ingen GPS: ' + err.message + '. Siden må åpnes fra en https-adresse, og posisjon må være tillatt.');
  }, {enableHighAccuracy:true, maximumAge:2000, timeout:30000});
} else say('Nettleseren støtter ikke GPS.');
}
